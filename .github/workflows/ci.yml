name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is being tested
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA attempt=$GITHUB_RUN_ATTEMPT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')"
          echo "msg=$(git log -1 --format=%s)"
          echo "--- files in the tested tree:"
          ls -1 | tr '\n' ' '
          echo

      - name: Simulate CI time
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f pr-sleep.txt ]; then s=$(cat pr-sleep.txt); else s=$(cat ci-sleep.txt 2>/dev/null || echo 90); fi
          echo "sleeping ${s}s"
          sleep "$s"

      - name: Checks
        run: |
          for a in pair-*-a.txt conflict-a.txt; do
            [ -e "$a" ] || continue
            b="${a%-a.txt}-b.txt"
            if [ -e "$b" ]; then echo "semantic conflict: $a and $b"; exit 1; fi
          done
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -e pfail.flag ]; then echo "pfail.flag: PR check fails"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            msg=$(git log -1 --format=%s)
            for f in qfail-*.flag; do
              [ -e "$f" ] || continue
              b="${f#qfail-}"; b="${b%.flag}"
              case "$msg" in */"$b") echo "entry-specific failure for $b"; exit 1;; esac
            done
            for f in qflaky-*.flag; do
              [ -e "$f" ] || continue
              b="${f#qflaky-}"; b="${b%.flag}"
              case "$msg" in */"$b") if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then echo "flaky failure (attempt 1) for $b"; exit 1; fi;; esac
            done
            if ls qbad-*.flag >/dev/null 2>&1; then echo "tree-wide failure (qbad flag in tree)"; exit 1; fi
          fi
          echo ok
