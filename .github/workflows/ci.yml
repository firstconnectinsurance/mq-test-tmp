name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is being tested
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "--- files in the tested tree:"
          ls -1 *.txt README.md 2>/dev/null || true

      - name: Simulate CI time
        run: sleep 90

      - name: Semantic conflict check
        run: |
          if [ -f conflict-a.txt ] && [ -f conflict-b.txt ]; then
            echo "conflict-a.txt and conflict-b.txt cannot exist together"
            exit 1
          fi
          echo "ok"
