name: Service CI
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  result:
    name: CI Result
    runs-on: ubuntu-latest
    steps:
      - name: Show the queue commit message (no personal data)
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            echo "MQMSG|length=$(jq -r '.merge_group.head_commit.message|length' "$GITHUB_EVENT_PATH")|lines=$(jq -r '.merge_group.head_commit.message|split("\\n")|length' "$GITHUB_EVENT_PATH")"
            echo "MQMSG|text=$(jq -c '.merge_group.head_commit.message' "$GITHUB_EVENT_PATH")"
          fi
          sleep 5
