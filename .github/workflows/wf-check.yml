name: wf-check
on:
  workflow_call:
    inputs:
      image_repo:
        required: true
        type: string
      command:
        required: true
        type: string
      job_name:
        required: false
        type: string
        default: ""
jobs:
  run:
    name: ${{ inputs.job_name || inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Per-entry duration and failure (by the queue commit subject)
        run: |
          MSG=$(git log -1 --format=%s); B="${MSG##*/}"
          S=15
          if [ "$GITHUB_EVENT_NAME" = merge_group ] && [ -e "slow-$B.txt" ]; then S=$(cat "slow-$B.txt"); fi
          echo "entry=$B duration=${S}s"
          sleep "$S"
          if [ "$GITHUB_EVENT_NAME" = merge_group ] && [ -e "qfail-$B.flag" ]; then echo "entry-specific failure for $B"; exit 1; fi
